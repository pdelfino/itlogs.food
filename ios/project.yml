# XcodeGen spec. `make ios-gen` turns this into ItlogsFood.xcodeproj (not committed).
name: ItlogsFood
options:
  bundleIdPrefix: food.itlogs
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"   # your Apple team id: DEVELOPMENT_TEAM=XXXXXXXXXX make ios-run (empty = unsigned build)
    MARKETING_VERSION: "0.1.0"
    POSTHOG_PROJECT_TOKEN: "${POSTHOG_PROJECT_TOKEN}"   # public project token, from server/.env at make ios-gen; never committed
    POSTHOG_HOST: "${POSTHOG_HOST}"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"   # commits on main, set by make ios-gen
    CODE_SIGN_STYLE: Automatic
targets:
  ItlogsFood:
    type: application
    platform: iOS
    sources: [Sources/ItlogsFood]
    info:
      path: Sources/ItlogsFood/Info.plist
      properties:
        CFBundleDisplayName: itlogs.food   # the spoken name for "Hey Meta, start ..." is set in the Wearables Developer Center (#7), not here
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ItlogsGitSHA: "${GIT_SHA}"   # set by make ios-gen
        PosthogProjectToken: $(POSTHOG_PROJECT_TOKEN)
        PosthogHost: $(POSTHOG_HOST)
        UILaunchScreen: {}
        NSCameraUsageDescription: The phone camera is the fallback frame source when the glasses are not connected.
        NSMicrophoneUsageDescription: Voice replies like "yes" or "eighty-one", and "log it".
        NSSpeechRecognitionUsageDescription: Voice replies are recognized on the phone and sent as text.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [audio, processing, bluetooth-central, bluetooth-peripheral, external-accessory]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]   # Bluetooth Classic, used by the camera stream
        # Meta Wearables Device Access Toolkit (required keys, see the CameraAccess sample)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [itlogsfood]
        MWDAT:
          AppLinkURLScheme: "itlogsfood://"
          MetaAppID: $(META_APP_ID)        # empty in Developer Mode; set from the Wearables Developer Center for release channels
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
          Analytics:
            OptOut: true
          CrashReporting:
            OptOut: true   # its handler re-raises SIGTRAP on the main thread and masks the real crash
        NSBluetoothAlwaysUsageDescription: Needed to connect to the Meta glasses.
        NSBluetoothPeripheralUsageDescription: Needed to connect to the Meta glasses.
        NSLocalNetworkUsageDescription: Lets the phone find the glasses over Wi-Fi and reach the itlogs.food server on the LAN.
        NSBonjourServices: [_bonjour._tcp]
        NSHealthUpdateUsageDescription: Each confirmed meal is written to Apple Health as food samples (energy, protein, carbs, fat, fiber, sodium) with the food name and grams.
        NSHealthShareUsageDescription: It Logs Food reads back only the energy it wrote, to show what it saved today. It reads nothing else from Health.
    # The camera stream rides a Wi-Fi network the glasses host; Meta's CameraAccess sample carries the
    # HotspotConfiguration and wifi-info entitlements, and without them the process died with SIGTRAP
    # at stream start (2026-11-01). Xcode: "Personal development teams do not support the Access Wi-Fi
    # Information and Hotspot capabilities", so they come back only with a paid Apple Developer Program
    # team (#10). Until then: stills over Bluetooth (#2 option B) or the phone camera.
    # entitlements:
    #   path: ItlogsFood.entitlements
    #   properties:
    #     com.apple.developer.networking.HotspotConfiguration: true
    #     com.apple.developer.networking.wifi-info: true
    entitlements:
      path: ItlogsFood.entitlements
      properties:
        com.apple.developer.healthkit: true   # Apple Health write on Confirm (#3); allowed on a personal team
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: food.itlogs.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        META_APP_ID: ""
        CLIENT_TOKEN: ""
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATSpeech
      - package: PostHog
        product: PostHog
  ItlogsFoodTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/ItlogsFoodTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ItlogsFood
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.56.0
